name: relay-compile

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  relay-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Relay client compile test (T36)
        run: bun test --test-name-pattern relay-compiler
